name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Run bundled JS actions (checkout, setup-uv) on Node 24; Node 20 is
# deprecated on the runners (forced 2026-06-02, removed 2026-09-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    # launchy is macOS-only by design; Linux CI would mostly just confirm
    # things that'd also fail on macOS, while signaling false portability.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags/history for the version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff
        run: uv run --locked --extra dev ruff check .

      - name: Pyright
        run: uv run --locked --extra dev pyright src/launchy

      - name: Tests
        run: uv run --locked --extra dev pytest -q
